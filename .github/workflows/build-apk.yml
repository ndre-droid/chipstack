name: Build Android APK

on:
  # manual only — build an APK on demand with `gh workflow run "Build Android APK"`
  # (kept off auto-push so Pages deploys don't also build APKs while iterating)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate stable signing keystore (once)
        env:
          CHIPSTACK_KEYSTORE_PASSWORD: ${{ secrets.CHIPSTACK_KEYSTORE_PASSWORD }}
          CHIPSTACK_KEY_PASSWORD: ${{ secrets.CHIPSTACK_KEY_PASSWORD }}
        run: |
          if [ ! -f keystore/chipstack.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/chipstack.jks \
              -alias chipstack \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${CHIPSTACK_KEYSTORE_PASSWORD:-chipstack}" \
              -keypass "${CHIPSTACK_KEY_PASSWORD:-chipstack}" \
              -dname "CN=ChipStack, OU=ChipStack, O=ChipStack, L=, ST=, C=DE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/chipstack.jks
            git commit -m "Add stable APK signing keystore [skip ci]"
            git push
          else
            echo "Keystore already committed — reusing it so installs update in place."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        env:
          CHIPSTACK_KEYSTORE_PASSWORD: ${{ secrets.CHIPSTACK_KEYSTORE_PASSWORD }}
          CHIPSTACK_KEY_PASSWORD: ${{ secrets.CHIPSTACK_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChipStack-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChipStack-debug-apk
          path: ChipStack-debug.apk
          if-no-files-found: error

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest ChipStack-debug.apk \
            --title "ChipStack — latest debug APK" \
            --notes "Auto-built debug APK. On your phone: download the .apk below, then open it and allow install from unknown sources."
